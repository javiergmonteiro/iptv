name: Probar candidatos
on:
  push:
    branches: [candidatos]
    paths: ["candidatos.m3u"]
jobs:
  probar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          rm -f estado.json
          python check_m3u.py candidatos.m3u candidatos_ok.m3u
      - run: |
          git config user.name "revisor-m3u"
          git config user.email "revisor-m3u@users.noreply.github.com"
          git add candidatos_ok.m3u informe.txt estado.json
          git commit -m "Resultado prueba candidatos"
          git push
